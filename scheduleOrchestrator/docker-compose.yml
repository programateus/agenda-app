services:
  postgres:
    image: postgres:16-alpine
    container_name: schedule-orchestrator-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
      POSTGRES_DB: schedule_orchestrator
    volumes:
      - schedule_orchestrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schedule_orchestrator_postgres_data:
